[project]
site_name = "A Catgirl's Diary"
site_description = "Little joys, soft thoughts, and a few paw prints. A diary by Artemis."
site_author = "Artemis"
site_url = "http://127.0.0.1:8000/"
docs_dir = "docs"
site_dir = "site"
copyright = "Made with love and a few paw prints by Artemis."
extra_css = ["assets/stylesheets/theme.css"]
nav = [
  { "Home" = "index.md" },
  { "Blog" = ["blog/index.md"] },
  { "About" = "about.md" },
]

[project.theme]
language = "en"
logo = "assets/images/cat-heart.svg"
favicon = "assets/images/favicon.svg"
font = false
features = ["navigation.tabs", "navigation.top", "navigation.footer", "search.highlight"]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "System appearance; switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Light appearance; switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Dark appearance; switch to system preference"

[project.plugins.search]

[project.plugins.blog]
post_excerpt = "required"
pagination_per_page = 4

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.superfences]
