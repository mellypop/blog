name: Publish diary

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Read Pages metadata
        id: pages
        uses: actions/configure-pages@v6
      - name: Install site and browser dependencies
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium firefox webkit
      - name: Set production URL
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path
          from urllib.parse import urlsplit

          base_url = os.environ["PAGES_BASE_URL"].rstrip("/") + "/"
          url = urlsplit(base_url)
          if url.scheme != "https" or not url.netloc or url.query or url.fragment:
              raise ValueError(f"Invalid GitHub Pages base URL: {base_url!r}")
          config = Path("zensical.toml")
          source, count = re.subn(
              r"^site_url\s*=.*$",
              lambda _: "site_url = " + json.dumps(base_url),
              config.read_text(),
              flags=re.MULTILINE,
          )
          if count != 1 or tomllib.loads(source)["project"]["site_url"] != base_url:
              raise ValueError("Expected exactly one project.site_url setting")
          config.write_text(source)
          PY
      - name: Build site
        run: zensical build --clean --strict
      - name: Check site in Chromium, Firefox, and WebKit
        run: python tests/browser_checks.py
      - name: Save browser reports and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: browser-checks
          path: .cache/browser-checks/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
